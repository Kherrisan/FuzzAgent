tools:
  bash:
    timeout: 120
    signature: bash <command>
    docstring: Run a command to interact with the system.
    arguments:
      - name: command
        type: string
        description: The command to run to interact with the system. If you need to search one file/directory or read/edit file contents, __PLEASE USE THE PROVIDED FUNCTIONS (open, edit, find_file, goto, scroll_up, scroll_down, write_file, etc.)__ rather than Linux commands (e.g. cat, less, more, fine, head, tail, find, echo, etc.).
        required: true
  send_agent_task:
    signature: send_agent_task <agent_name> <task_description>
    docstring: Send a task to a specific agent.
    arguments:
      - name: agent_name
        type: string
        description: The name of the agent to send the task to.
        enum: ["BuilderAgent", "DictionaryAgent", "SeedAgent", "HarnessAgent", "CoverageAnalyzerAgent", "FuzzerExecutorAgent", "CrashAnalyzerAgent"]
        required: true
      - name: task_description
        type: string
        description: The detailed description of the task to send to the agent.
        required: true
  finish_task:
    signature: finish_task <exit_reason> [status] [force]
    docstring: |
      Finish the task before ending your turn. exit_reason names the condition and the task ids.
      status=done: every dispatched sub-agent task has finished successfully, none is blocked or failed,
      and this manager task is finished. Guards apply.
      status=failed: any dispatched sub-agent task finished as failed, or this task failed and there is
      no basis to treat the result as correct. Guards are skipped.
      status=blocked: any dispatched sub-agent task finished as blocked, or this task is blocked and
      there is no basis to treat the result as correct or to continue, or you need a decision, or
      several checks show no change. One check is one observe_agent_states call and one
      observe_current_states call. No change means every agent's status and turn, and the artifact
      status, match the previous check. Guards are skipped.
      An agent that dispatched no sub-agents applies these statuses to its own task only.
    arguments:
      - name: exit_reason
        type: string
        description: The reason to finish the task. Report the task status before finishing.
        required: true
      - name: status
        type: string
        description: done = every sub-agent finished successfully and this task is finished; failed = a sub-agent failed, or this task failed with no basis to treat the result as correct; blocked = a sub-agent blocked, or this task is blocked with no basis to treat the result as correct or to continue, or a decision is needed, or several observe_agent_states and observe_current_states checks show no change.
        required: false
        enum: ["done", "blocked", "failed"]
      - name: force
        type: boolean
        description: Finish even if the guards would reject it. Use this only for a fatal error that cannot be fixed in the current task.
        required: false
  wait_agent_task:
    signature: wait_agent_task <task_id>
    docstring: Check whether a task dispatched with send_agent_task has finished. Returns immediately.
    arguments:
      - name: task_id
        type: string
        description: The task id returned by send_agent_task.
        required: true