services:
  fuzzagent:
    image: fuzzagent
    container_name: ${CONTAINER_NAME}
    init: true
    stdin_open: true
    tty: true
    command: /bin/bash -c "${COMMAND}"
    volumes:
      - ${FUZZAGENT_DIR}:/root/FuzzAgent:${WRITE_MODE}
      - ${RAW_OUTPUT_DIR}:/root/FuzzAgent/output/${REPO_BASE_NAME}
      - ${SRC_DIR}:/src/${REPO_BASE_NAME}
      - ${FUZZAGENT_AUTH_DIR:-./.cache/auth}:/run/fuzzagent-auth:ro
    security_opt:
      - seccomp=unconfined
    cap_add:
      - SYS_ADMIN
      - NET_ADMIN
    environment:
      - FUZZAGENT_AUTO_CLEAN=${FUZZAGENT_AUTO_CLEAN:-0}
      - FUZZAGENT_RESUME=${FUZZAGENT_RESUME:-0}
      - HC_SESSION=${HC_SESSION:-fz-${REPO_BASE_NAME}}
      - FUZZAGENT_ENGINE=${FUZZAGENT_ENGINE:-hc}
      - FUZZAGENT_CONFIG=${FUZZAGENT_CONFIG:-config/campaign.yaml}
      - HOST_AUTH_DIR=${HOST_AUTH_DIR:-/run/fuzzagent-auth}
      - REPO_BASE_NAME=${REPO_BASE_NAME}
      - SRC=/root/src/${REPO_BASE_NAME}
      - OUTPUT=/root/FuzzAgent/output/${REPO_BASE_NAME}
      - AFL_SKIP_CPUFREQ=1
      - FUZZING_ENGINE=${FUZZING_ENGINE}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL}
      # Per-model LLM tuning forwarded from Backend's llm_models.toml.
      # Defaults match Core's LLMArgs so missing values still work.
      - LLM_TEMPERATURE=${LLM_TEMPERATURE:-0.6}
      - LLM_TOP_P=${LLM_TOP_P:-0.9}
      - LLM_TOP_K=${LLM_TOP_K:-20}
      - LLM_REPLY_TIMEOUT=${LLM_REPLY_TIMEOUT:-600}
      - MAX_AGENT_EPOCHS=${MAX_AGENT_EPOCHS:-100}
      - FUZZING_DURATION=${FUZZING_DURATION:-24h}
      - REMINDER_TOKEN_RATIO=${REMINDER_TOKEN_RATIO:-0.8}
      - MAX_TOKEN_LEN=${MAX_TOKEN_LEN:-128000}
      - OSS_ACCESS_KEY_ID=${OSS_ACCESS_KEY_ID:-}
      - OSS_ACCESS_KEY_SECRET=${OSS_ACCESS_KEY_SECRET:-}
      - OSS_ENDPOINT=${OSS_ENDPOINT:-}
      - OSS_BUCKET=${OSS_BUCKET:-}
      - http_proxy=${http_proxy:-}
      - https_proxy=${https_proxy:-}
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - no_proxy=${no_proxy:-localhost,127.0.0.1,211.65.197.92}
      - NO_PROXY=${NO_PROXY:-localhost,127.0.0.1,211.65.197.92}
    restart: "no"
