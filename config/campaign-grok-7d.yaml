# Seven-day grok profile. Same agents as campaign-grok.yaml.
# The outer `timeout` and this duration_hours must both cover the run;
# campaignctl stops at duration_hours even if the container timeout is longer.

name: "${REPO_BASE_NAME}"
target: "${REPO_BASE_NAME}"
src: "${SRC}"
output: "${OUTPUT}"
session: "${HC_SESSION}"

duration_hours: 168
coverage_guidance: true

engine: hc
manager_role: ManagerAgent
agents_dir: config/agents-grok

auth_config: config/agent_auth-grok.toml

max_rounds: 0

hc:
  binary: hc
  session: "${HC_SESSION}"
  wait_timeout: 300
  poll_seconds: 30
  keep: true
  outlive_parent: true

resume:
  mode: auto
  brief_tasks: 10

blocked_backoff_seconds: 30
max_blocked_rounds: 3

setup_script: config/setup/${REPO_BASE_NAME}.sh
setup_timeout_seconds: 3600
