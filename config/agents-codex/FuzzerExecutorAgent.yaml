role: FuzzerExecutorAgent
enabled: true
driver: codex
launch:
- codex
- --no-daemon
- --model
- gpt-6-luna
- -c
- model_reasoning_effort="high"
- -c
- check_for_update_on_startup=false
model: gpt-6-luna
provider: openai
card: src/agents/FuzzerExecutorAgent/.well-know/agent.json
home: ${OUTPUT}/.campaign/agents/FuzzerExecutorAgent/home
cwd: ${OUTPUT}/.campaign/agents/FuzzerExecutorAgent/work
prompt:
  source: src.agents.FuzzerExecutorAgent.prompt:SYSTEM_PROMPT
  response_format: true
  delivery: first_send
tools:
  include:
  - run_fuzz_target
  - finish_task
mcp:
  transport: stdio
  server: fuzzagent-mcp
  role_arg: FuzzerExecutorAgent
session:
  policy: resume
  id_source:
  - index_file
  - probe
  reset_on:
  - error
dispatch:
  block_seconds: 0
  poll_seconds: 30
status: native
