role: ManagerAgent
enabled: true
driver: codex
launch:
- codex
- --no-daemon
- --model
- gpt-6-luna
- -c
- model_reasoning_effort="high"
- -c
- check_for_update_on_startup=false
model: gpt-6-luna
provider: openai
card: src/agents/ManagerAgent/.well-know/agent.json
home: ${OUTPUT}/.campaign/agents/ManagerAgent/home
cwd: ${OUTPUT}/.campaign/agents/ManagerAgent/work
prompt:
  source: src.agents.ManagerAgent.prompt:SYSTEM_PROMPT
  guidance_variant: src.agents.ManagerAgent.prompt:NO_COVERAGE_GUIDANCE_SYSTEM_PROMPT
  response_format: true
  delivery: first_send
tools:
  include:
  - observe_current_states
  - send_agent_task
  - wait_agent_task
mcp:
  transport: stdio
  server: fuzzagent-mcp
  role_arg: ManagerAgent
session:
  policy: resume
  id_source:
  - index_file
  - probe
  reset_on:
  - error
dispatch:
  block_seconds: 0
  poll_seconds: 30
status: native
