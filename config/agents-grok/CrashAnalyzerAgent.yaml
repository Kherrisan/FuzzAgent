role: CrashAnalyzerAgent
enabled: true
driver: grok
launch:
- grok
- --model
- grok-4.7
- --reasoning-effort
- high
model: grok-4.7
card: src/agents/CrashAnalyzerAgent/.well-know/agent.json
home: ${OUTPUT}/.campaign/agents/CrashAnalyzerAgent/home
cwd: ${OUTPUT}/.campaign/agents/CrashAnalyzerAgent/work
prompt:
  source: src.agents.CrashAnalyzerAgent.prompt:SYSTEM_PROMPT
  response_format: true
  delivery: first_send
tools:
  include:
  - crash_artifact_analysis
  - crash_debugger
  - generate_crash_report
  - finish_task
mcp:
  transport: stdio
  server: fuzzagent-mcp
  role_arg: CrashAnalyzerAgent
session:
  policy: resume
  id_source:
  - index_file
  - probe
  reset_on:
  - error
dispatch:
  block_seconds: 0
  poll_seconds: 30
status: native
snapshot:
  true: done
  mode: artifacts
