role: FuzzerExecutorAgent
enabled: true
driver: pi
launch:
- pi
- --provider
- ark
- --model
- deepseek-v4-1-flash-261017
model: ark/deepseek-v4-1-flash-261017
provider: ark
card: src/agents/FuzzerExecutorAgent/.well-know/agent.json
home: ${OUTPUT}/.campaign/agents/FuzzerExecutorAgent/home
cwd: ${OUTPUT}/.campaign/agents/FuzzerExecutorAgent/work
prompt:
  source: src.agents.FuzzerExecutorAgent.prompt:SYSTEM_PROMPT
  response_format: true
  delivery: first_send
tools:
  include:
  - run_fuzz_target
  - finish_task
mcp:
  transport: stdio
  server: fuzzagent-mcp
  role_arg: FuzzerExecutorAgent
session:
  policy: resume
  id_source:
  - index_file
  - probe
  reset_on:
  - error
dispatch:
  block_seconds: 0
  poll_seconds: 30
status: native
