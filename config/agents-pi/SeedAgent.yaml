role: SeedAgent
enabled: true
driver: pi
launch:
- pi
- --provider
- ark
- --model
- deepseek-v4-1-flash-261017
model: ark/deepseek-v4-1-flash-261017
provider: ark
card: src/agents/SeedAgent/.well-know/agent.json
home: ${OUTPUT}/.campaign/agents/SeedAgent/home
cwd: ${OUTPUT}/.campaign/agents/SeedAgent/work
prompt:
  source: src.agents.SeedAgent.prompt:SYSTEM_PROMPT
  response_format: true
  delivery: first_send
tools:
  include:
  - track_web_retrieve_progress
  - finish_task
mcp:
  transport: stdio
  server: fuzzagent-mcp
  role_arg: SeedAgent
session:
  policy: resume
  id_source:
  - index_file
  - probe
  reset_on:
  - error
dispatch:
  block_seconds: 0
  poll_seconds: 30
status: native
