role: BuilderAgent
enabled: true
driver: pi
launch:
- pi
- --provider
- ark
- --model
- deepseek-v4-1-flash-261017
model: ark/deepseek-v4-1-flash-261017
provider: ark
card: src/agents/BuilderAgent/.well-know/agent.json
home: ${OUTPUT}/.campaign/agents/BuilderAgent/home
cwd: ${OUTPUT}/.campaign/agents/BuilderAgent/work
prompt:
  source: src.agents.BuilderAgent.prompt:SYSTEM_PROMPT
  response_format: true
  delivery: first_send
tools:
  include:
  - run_and_check_build_script
  - finish_task
mcp:
  transport: stdio
  server: fuzzagent-mcp
  role_arg: BuilderAgent
session:
  policy: resume
  id_source:
  - index_file
  - probe
  reset_on:
  - error
dispatch:
  block_seconds: 0
  poll_seconds: 30
status: native
