# Campaign profile: every role runs the dsh-TUI over the `ark` LLM API
# (config/dsh/profiles/fuzzagent/cordis.patch.yml).
#
#   export SRC=/src/wolfssl OUTPUT=$PWD/output/wolfssl HC_SESSION=fz-wolfssl
#   export HOST_AUTH_DIR=/run/fuzzagent-auth
#   campaignctl --config config/campaign-codex.yaml prepare
#   campaignctl --config config/campaign-codex.yaml up --resume

name: "${REPO_BASE_NAME}"
target: "${REPO_BASE_NAME}"
src: "${SRC}"
output: "${OUTPUT}"
session: "${HC_SESSION}"

duration_hours: 24
coverage_guidance: true

engine: hc
manager_role: ManagerAgent
agents_dir: config/agents-dsh-tui

# Every role gets the host machine's Codex credentials, copied into its own
# isolated HOME before the terminal starts.
auth_config: config/agent_auth-dsh.toml

max_rounds: 0

hc:
  binary: hc
  session: "${HC_SESSION}"
  wait_timeout: 300
  poll_seconds: 30
  keep: true
  outlive_parent: true


resume:
  mode: auto
  brief_tasks: 10

# When a manager round ends with status=blocked, wait this long before the
# next round, and stop the campaign after this many blocked rounds in a row
# (0 = never stop).
blocked_backoff_seconds: 30
max_blocked_rounds: 3

# Provisioning hook, run once inside the container before round 1. The script
# installs the libraries and build tools the target needs; the campaign starts
# only when it exits 0, and a non-zero exit stops the container. The path is
# per target (REPO_BASE_NAME is set by the launcher), so adding a new target
# only means dropping config/setup/<target>.sh next to these two.
setup_script: config/setup/${REPO_BASE_NAME}.sh
setup_timeout_seconds: 3600

