# dsh profile patch layer for the `tui` profile.
#
# Applied after every bundle layer (see @deepseek-ai/dsh README, "Profiles":
# bundle patches -> profile cordis.patch.yml -> $DSH_HOME/cordis.patch.yml ->
# --patch overlays).
#
# This file adds one LLM API provider, `ark`, copied from the host's own dsh
# configuration (~/.dsh/profiles/dsh-tui/cordis.patch.yml):
#
#   baseURL : https://ark.cn-beijing.volces.com/api/v3
#   api     : openai-completions
#   model   : deepseek-flash  (DeepSeek V4.1 Flash, 1M context)
#   api key : read from $ARK_FLASH_API_KEY
#
# The key itself is NOT stored here. dsh keeps it in its credential store
# (~/.dsh/.credentials.yaml, under `refs: ARK_FLASH_API_KEY`) and exposes it to
# plugins as the environment variable named by `apiKeyEnv`. To use the host's
# key inside a campaign container, copy the credential store into the role's
# DSH_HOME (see config/agent_auth-dsh.toml) or export ARK_FLASH_API_KEY.

- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      ark:
        displayName: Ark
        apiKeyEnv: ARK_FLASH_API_KEY
        api: openai-completions
        baseURL: https://ark.cn-beijing.volces.com/api/v3
        models:
          - id: deepseek-flash
            name: DeepSeek Flash
            contextWindow: 1048576
        retryPolicy:
          mode: normal
          maxRetries: 5
          retryableCodes:
            - EMPTY_RESPONSE
            - RATE_LIMIT
            - SERVER
            - TIMEOUT
            - TRANSPORT
            - STREAM_CLOSED
