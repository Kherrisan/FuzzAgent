role: SeedAgent
enabled: true
driver: grok
launch: ["grok"]
card: src/agents/SeedAgent/.well-know/agent.json

home: "${OUTPUT}/.campaign/agents/SeedAgent/home"
cwd: "${OUTPUT}/.campaign/agents/SeedAgent/work"

prompt:
  source: "src.agents.SeedAgent.prompt:SYSTEM_PROMPT"
  response_format: true
  delivery: first_send

tools:
  include:
    - track_web_retrieve_progress
    - finish_task

mcp: {transport: stdio, server: fuzzagent-mcp, role_arg: SeedAgent}
session: {policy: resume, id_source: [index_file, probe], reset_on: [error]}
dispatch: {block_seconds: 0, poll_seconds: 30}
status: native
snapshot: {on: done, mode: artifacts}
