role: ManagerAgent
enabled: true
driver: codex
launch: ["codex", "--no-daemon"]
model: gpt-5.1-codex
provider: openai
card: src/agents/ManagerAgent/.well-know/agent.json

home: "${OUTPUT}/.campaign/agents/ManagerAgent/home"
cwd: "${OUTPUT}/.campaign/agents/ManagerAgent/work"
env:
  OPENAI_BASE_URL: "${OPENAI_BASE_URL}"
  OPENAI_API_KEY: "${OPENAI_API_KEY}"

prompt:
  source: "src.agents.ManagerAgent.prompt:SYSTEM_PROMPT"
  guidance_variant: "src.agents.ManagerAgent.prompt:NO_COVERAGE_GUIDANCE_SYSTEM_PROMPT"
  response_format: true
  delivery: first_send

tools:
  include:
    - observe_current_states
    - send_agent_task
    - wait_agent_task
    - finish_task

mcp: {transport: stdio, server: fuzzagent-mcp, role_arg: ManagerAgent}
session: {policy: resume, id_source: [index_file, probe], reset_on: [error]}
dispatch: {block_seconds: 0, poll_seconds: 30}
status: native
snapshot: {on: done, mode: artifacts}
