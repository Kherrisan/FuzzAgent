role: DictionaryAgent
enabled: true
driver: dsh-tui
launch:
- dsh
# provider/model name the route this role may use. The dsh driver injects
# them as `allowedModels` into the per-role patch overlay, so the run cannot
# switch to another provider or model. The route itself is declared in
# config/dsh/profiles/tui/cordis.patch.yml.
model: ark/deepseek-v4-1-flash-261017
provider: ark
card: src/agents/DictionaryAgent/.well-know/agent.json
home: ${OUTPUT}/.campaign/agents/DictionaryAgent/home
cwd: ${OUTPUT}/.campaign/agents/DictionaryAgent/work
prompt:
  source: src.agents.DictionaryAgent.prompt:SYSTEM_PROMPT
  response_format: true
  delivery: first_send
tools:
  include:
  - validate_dictionary_file
  - track_web_retrieve_progress
  - finish_task
mcp:
  transport: stdio
  server: fuzzagent-mcp
  role_arg: DictionaryAgent
session:
  policy: resume
  id_source:
  - index_file
  - probe
  reset_on:
  - error
dispatch:
  block_seconds: 0
  poll_seconds: 30
status: native
