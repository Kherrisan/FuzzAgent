role: CoverageAnalyzerAgent
enabled: true
driver: dsh-tui
launch:
- dsh
# provider/model name the route this role may use. The dsh driver injects
# them as `allowedModels` into the per-role patch overlay, so the run cannot
# switch to another provider or model. The route itself is declared in
# config/dsh/profiles/tui/cordis.patch.yml.
model: ark/deepseek-v4-1-flash-261017
provider: ark
card: src/agents/CoverageAnalyzerAgent/.well-know/agent.json
home: ${OUTPUT}/.campaign/agents/CoverageAnalyzerAgent/home
cwd: ${OUTPUT}/.campaign/agents/CoverageAnalyzerAgent/work
prompt:
  source: src.agents.CoverageAnalyzerAgent.prompt:SYSTEM_PROMPT
  response_format: true
  delivery: first_send
tools:
  include:
  - show_overview_code_coverage
  - show_module_code_coverage
  - show_file_code_coverage
  - show_api_code_coverage
  - show_func_code_coverage
  - show_branch_blocker_code_coverage
  - call_chain_analysis
  - generate_coverage_guidance_report
  - finish_task
mcp:
  transport: stdio
  server: fuzzagent-mcp
  role_arg: CoverageAnalyzerAgent
session:
  policy: resume
  id_source:
  - index_file
  - probe
  reset_on:
  - error
dispatch:
  block_seconds: 0
  poll_seconds: 30
status: native
